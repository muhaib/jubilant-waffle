<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant POS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar">
    <div class="brand" id="brand">Restaurant POS</div>
    <div class="tenant" id="tenant-name"></div>
    <nav id="nav"></nav>
    <button class="navlink" onclick="Auth.logout()">Log out</button>
  </div>
  <div class="main">
    <div class="topbar">
      <h1 id="view-title">Loading…</h1>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-backdrop" id="item-modal" style="display:none;">
  <div class="modal" style="max-width:520px;">
    <h3 style="margin-top:0;">Edit menu item</h3>
    <div class="field"><label>Name</label><input id="im-name" /></div>
    <div class="row" style="gap:12px;">
      <div class="field" style="flex:1;"><label>Category</label><select id="im-category"></select></div>
      <div class="field" style="flex:1;"><label>Base price</label><input type="number" step="0.01" id="im-price" /></div>
    </div>
    <div class="field"><label>Description</label><textarea id="im-description" rows="2"></textarea></div>
    <div class="field">
      <label>Photo</label>
      <div class="row" style="align-items:center;">
        <img id="im-photo-preview" style="width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);display:none;" />
        <input type="file" id="im-photo-input" accept="image/*" style="flex:1;" />
      </div>
      <div class="error-text" id="im-photo-error" style="display:none;"></div>
    </div>
    <div class="field">
      <label>Size modifiers (optional — e.g. Small / Medium / Large, each with its own price)</label>
      <div id="im-sizes-list" style="margin-bottom:6px;"></div>
      <div class="row">
        <input id="im-size-name" placeholder="Size name" style="flex:2;" />
        <input id="im-size-price" type="number" step="0.01" placeholder="Price" style="flex:1;" />
        <button type="button" class="small secondary" onclick="addSize()">Add size</button>
      </div>
    </div>
    <div class="field"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="im-available" style="width:auto;" /> Available on menu</label></div>
    <div class="row" style="justify-content:flex-end;">
      <button class="secondary" onclick="closeItemModal()">Close</button>
      <button onclick="saveItemModal()">Save</button>
    </div>
    <div class="error-text" id="im-error" style="display:none;"></div>
  </div>
</div>

<div class="modal-backdrop" id="size-modal" style="display:none;">
  <div class="modal" style="max-width:320px;">
    <h3 style="margin-top:0;" id="size-modal-title">Choose a size</h3>
    <div id="size-modal-options" class="grid" style="gap:8px;"></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px;">
      <button class="secondary" onclick="closeSizeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
