<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant POS — Sign in</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="center-screen">
  <div class="card" style="width:100%;max-width:360px;">
    <h2 style="margin-top:0;">Restaurant POS</h2>
    <p class="muted" style="margin-top:-8px;">Sign in to continue</p>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autofocus />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" style="width:100%;">Sign in</button>
      <div class="error-text" id="error" style="display:none;"></div>
    </form>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  if (Auth.token && Auth.user) {
    window.location.href = Auth.user.role === 'super_admin' ? '/master' : '/app';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('error');
    errorEl.style.display = 'none';
    try {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { token, user } = await api('/api/auth/login', { method: 'POST', body: { email, password } });
      Auth.save(token, user);
      window.location.href = user.role === 'super_admin' ? '/master' : '/app';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
