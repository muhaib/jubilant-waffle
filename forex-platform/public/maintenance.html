<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/site.css">
<title>Maintenance — Meridian FX</title>
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:var(--s-6);background:var(--ink-50)">
  <div style="max-width:480px;text-align:center">
    <a class="brand" href="/" style="justify-content:center;margin-bottom:var(--s-8)">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5 9 11l4 4 8-9"/><path d="M21 6v5h-5"/></svg>
      </span>
      <span>Meridian FX</span>
    </a>
    <div class="card">
      <div class="card-body">
        <h1 style="font-size:var(--t-xl);margin-bottom:var(--s-3)">We are carrying out maintenance</h1>
        <p class="muted" style="font-size:var(--t-base)">The platform is briefly unavailable while we make some changes. Your account, your balance and your records are unaffected. Please try again shortly.</p>
        <div class="row" style="justify-content:center;margin-top:var(--s-6)"><a class="btn btn-secondary" href="/">Try again</a></div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
