<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Meridian FX</title>
<meta name="theme-color" content="#0b2545">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5 9 11l4 4 8-9"/><path d="M21 6v5h-5"/></svg>
      </span>
      <span data-platform-name>Meridian FX</span>
    </a>
    <div class="header-actions" style="margin-left:auto">
      <a class="btn btn-secondary" href="/">Back to site</a>
    </div>
  </div>
</header>

<main id="main" class="section">
  <div class="container" style="display:grid;grid-template-columns:240px 1fr;gap:var(--s-12);align-items:start">
    <nav aria-label="Legal documents" id="legal-nav" style="position:sticky;top:96px"></nav>
    <div>
      <div class="notice notice-warn" style="margin-bottom:var(--s-8)">
        <svg class="notice-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17v.5"/><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <div><strong>Forex trading involves substantial risk.</strong>You may lose some or all of your invested capital. Illustrative figures shown on this platform are examples of an arithmetic model, not guaranteed returns.</div>
      </div>
      <h1 id="legal-title" style="margin-bottom:var(--s-2)">Legal</h1>
      <p class="muted" id="legal-updated" style="margin-bottom:var(--s-8)"></p>
      <div id="legal-body"><div class="skeleton skeleton-line" style="width:90%"></div><div class="skeleton skeleton-line" style="width:76%"></div><div class="skeleton skeleton-line" style="width:84%"></div></div>
    </div>
  </div>
</main>

<style>
@media (max-width: 800px) {
  #main .container { grid-template-columns: 1fr !important; gap: var(--s-6) !important; }
  #legal-nav { position: static !important; }
}
#legal-nav a { display:block; padding: var(--s-2) var(--s-3); border-radius: var(--r-sm); color: var(--ink-600); font-size: var(--t-base); }
#legal-nav a[aria-current='true'] { background: var(--brand-50); color: var(--brand-700); font-weight: 560; }
</style>

<script type="module" src="/assets/js/legal.js"></script>
</body>
</html>
